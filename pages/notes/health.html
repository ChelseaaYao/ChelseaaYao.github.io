<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellness · Chelsea</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px;letter-spacing:.5px;}

  /* 单位开关（ledger 同款滑块，放大标题右侧） */
  .titlebar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .xt{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.2px;
    color:var(--muted);cursor:pointer;user-select:none;transition:color .15s ease;}
  .xt:hover{color:var(--ink);}
  .xt .sw{width:32px;height:18px;border-radius:9px;background:#3a3f48;position:relative;
    flex:none;transition:background .2s ease;}
  .xt .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
    border-radius:50%;background:#8a919c;transition:left .2s ease,background .2s ease;}
  .xt.on{color:var(--ink);}
  .xt.on .sw{background:var(--cd);}
  .xt.on .sw::after{left:16px;background:#fff;}

  /* 副标题（与 ledger .hs-label 完全一致） */
  .subtitle{font-size:12px;color:var(--muted);letter-spacing:1.5px;margin:5px 0 0;}

  /* 顶部大数字 */
  #hs-row{margin:24px 0 24px;display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;}
  .hs + .hs{border-left:1px dashed var(--line);padding-left:26px;}
  .hs-label{font-size:12px;color:var(--muted);letter-spacing:1.5px;}
  .hs-num{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.5px;line-height:1.15;
    background:linear-gradient(92deg,var(--cd) 10%,var(--jp) 55%,var(--bj) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
  .hs-num i{font-style:normal;font-size:15px;margin-left:4px;-webkit-text-fill-color:var(--muted);}
  .hs-num.good{background:none;-webkit-background-clip:unset;background-clip:unset;color:var(--sy);}
  .hs-num.bad{background:none;-webkit-background-clip:unset;background-clip:unset;color:var(--jp);}
  .hs-sub{font-size:11px;color:var(--muted);margin-top:2px;}

  .card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:6px 18px 12px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.5px;
    margin:0 0 4px;padding:10px 0;display:flex;align-items:baseline;border-bottom:1px solid var(--line);}
  .card h2 .gp{margin-left:auto;font-size:12px;color:var(--muted);}
  .card h2 .gp .gt{font-size:17px;font-weight:700;color:var(--bj);}
  .empty{padding:26px 6px;text-align:center;color:var(--muted);font-size:14px;}

  /* 趋势图 */
  .chart-wrap{padding:10px 2px 0;}
  .chart{display:block;margin:0 auto;max-width:100%;height:auto;}
  .chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;}
  .chart .ax{fill:#9aa1ab;font-size:10px;letter-spacing:.3px;}
  .chart .line{fill:none;stroke:var(--cd);stroke-width:1.8;stroke-linejoin:round;}
  .chart .area{stroke:none;fill:url(#wg);}
  .chart .ma{fill:none;stroke:var(--fly);stroke-width:1.6;stroke-dasharray:6 4;opacity:.9;stroke-linejoin:round;}
  .chart .dot{fill:var(--cd);stroke:var(--paper);stroke-width:1.2;pointer-events:none;}
  .chart .hit{fill:transparent;pointer-events:all;cursor:pointer;}
  .chart .hit:hover{fill:rgba(242,142,84,.18);}
  .chart .mdot{cursor:pointer;}

  /* 悬浮提示 */
  .tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s ease;
    background:#1f2126;border:1px solid #4a505a;border-radius:8px;padding:5px 11px;
    font-size:12.5px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:nowrap;}
  .tip.on{opacity:1;}
  .chart .goalln{stroke:var(--sy);stroke-width:1;stroke-dasharray:5 4;opacity:.8;}
  .chart .goal-lab{fill:var(--sy);font-size:10px;letter-spacing:.3px;}
  .chart .pmark{stroke:var(--jp);stroke-width:1;stroke-dasharray:3 3;opacity:.55;}
  .chart .pflower{font-size:9px;}
  .chart .avgln{stroke:#9aa1ab;stroke-width:1;stroke-dasharray:4 4;opacity:.65;}
  .chart .ring{fill:none;stroke-width:1.5;}
  .chart .ring.max{stroke:var(--jp);}
  .chart .ring.min{stroke:var(--sy);}
  h2 .rtabs{margin-left:auto;display:inline-flex;gap:8px;}
  h2 .rt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:2px 12px;cursor:pointer;transition:color .15s ease,border-color .15s ease;}
  h2 .rt:hover{color:var(--ink);border-color:#4a505a;}
  h2 .rt.on{color:var(--cd);border-color:var(--cd);font-weight:700;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:4px 6px 8px;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:16px;height:0;border-top:2px solid;border-radius:1px;}
  .legend .lw{border-color:var(--cd);}
  .legend .lm{border-top-style:dashed;border-color:var(--fly);}
  .legend .lp{border-top-style:dashed;border-color:var(--jp);}
  .legend .lg{border-top-style:dashed;border-color:var(--sy);}

  /* 生理周期卡 */
  .chips{display:flex;gap:10px;flex-wrap:wrap;padding:12px 2px 10px;}
  .chip{border:1px solid var(--line);border-radius:10px;background:#2a2d34;
    padding:8px 14px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:86px;}
  .chip .ck{font-size:10.5px;color:var(--muted);letter-spacing:1px;}
  .chip .cv{font-family:var(--serif);font-size:17px;font-weight:700;}
  .chip.nx{border-color:var(--jp);background:rgba(229,107,126,.08);}
  .chip.nx .ck{color:var(--jp);}
  .chip.nx .cv{color:var(--jp);}
  /* 经期时间轴 */
  .chart .pblock{fill:var(--jp);opacity:.92;cursor:pointer;}
  .chart .pghost{fill:rgba(229,107,126,.1);stroke:var(--jp);stroke-width:1;stroke-dasharray:4 3;cursor:pointer;}
  .chart .plab{fill:#f4949a;font-size:10.5px;font-weight:700;}
  .chart .plab.ghost{opacity:.85;font-weight:400;}
  .chart .cycln{stroke:#5a616c;stroke-width:1;stroke-dasharray:3 3;}
  .chart .cyclab{fill:#9aa1ab;font-size:10.5px;letter-spacing:.3px;}
  .chart .todayln{stroke:var(--cd);stroke-width:1;stroke-dasharray:3 3;opacity:.7;}
  .chart .todaylab{fill:var(--cd);font-size:9.5px;letter-spacing:.5px;}
  .pred{padding:10px 6px 4px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:4px;}
  .pred b{color:var(--jp);}
  .pred .late{margin-left:6px;color:var(--bj);}

  /* 月均体重折线 */
  .chart .mline{fill:none;stroke:var(--bj);stroke-width:1.8;stroke-linejoin:round;}
  .chart .mdot{fill:var(--bj);stroke:var(--paper);stroke-width:1.5;}
  .chart .mdot.good{fill:var(--sy);}
  .chart .mdot.bad{fill:var(--jp);}
  .chart .mval{fill:#e8eaed;font-size:11px;font-weight:700;}
  .chart .mval.good{fill:var(--sy);}
  .chart .mval.bad{fill:var(--jp);}
  .chart .mmon{fill:#9aa1ab;font-size:11px;letter-spacing:.5px;}

  /* 记录列表月份组头 */
  .mhead{margin:12px 2px 2px;font-size:11px;color:var(--muted);letter-spacing:1.5px;
    border-bottom:1px solid var(--line);padding:0 4px 5px;}

  /* 月份切换胶囊（ledger 同款） */
  .mtabs{display:flex;flex-wrap:wrap;gap:9px;margin:10px 2px 10px;justify-content:center;}
  .mt{padding:5px 16px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;
    color:var(--muted);cursor:pointer;transition:color .15s ease,border-color .15s ease;}
  .mt:hover{color:var(--ink);border-color:#4a505a;}
  .mt.on{color:var(--cd);border-color:var(--cd);font-weight:700;}

  /* 迷你月历（参考薄荷健康 + 网格线）：日期居中、体重在下 */
  .calwrap{margin:6px 0 4px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cw{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px;letter-spacing:1px;}
  .cw.wk{color:var(--wknd);}
  .cday{min-height:54px;padding:5px 2px 6px;min-width:0;text-align:center;
    border-top:1px dashed var(--line);border-right:1px dashed var(--line);}
  .cday:nth-child(7n){border-right:none;}
  .cday:nth-child(7n+1){border-left:none;}
  .cn{display:block;width:26px;line-height:26px;margin:0 auto;font-size:14.5px;font-weight:600;
    color:var(--wkdy);border-radius:50%;}
  .cday.today .cn{color:var(--cd);font-weight:700;background:rgba(242,142,84,.13);box-shadow:inset 0 0 0 1.5px var(--cd);}
  .cday.period .cn{color:#f4949a;font-weight:700;}
  .cday.period.today .cn{color:var(--jp);background:rgba(229,107,126,.13);box-shadow:inset 0 0 0 1.5px var(--jp);}
  .dsum{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--cd);margin-top:3px;}

  /* 本月统计条 */
  .mstats{display:flex;border:1px solid var(--line);border-radius:12px;background:#2a2d34;
    padding:12px 4px;margin:10px auto 14px;max-width:640px;}
  .ms{flex:1;text-align:center;min-width:0;}
  .ms + .ms{border-left:1px dashed var(--line);}
  .ms .k{display:block;font-size:10.5px;color:var(--muted);letter-spacing:1.2px;margin-bottom:3px;}
  .ms b{font-family:var(--serif);font-size:17px;letter-spacing:.3px;}
  .ms b.hl{font-size:19px;background:linear-gradient(92deg,var(--cd) 10%,var(--jp) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .ms b.good{color:var(--sy);}
  .ms b.bad{color:var(--jp);}

  /* 记录列表 */
  .row{display:flex;align-items:baseline;gap:14px;padding:6px 6px;font-size:13.5px;
    border-radius:6px;transition:background .12s ease;}
  .row + .row{border-top:1px dashed var(--line);}
  .row:hover{background:#2e323a;}
  .row .d{flex:none;min-width:110px;color:var(--muted);}
  .row .dwk{margin-left:7px;font-size:10.5px;opacity:.8;}
  .row .w{flex:none;min-width:64px;font-weight:700;font-family:var(--serif);}
  .row .df{flex:none;min-width:64px;font-size:12px;color:var(--muted);}
  .row .df.good{color:var(--sy);font-weight:700;}
  .row .df.bad{color:var(--jp);font-weight:700;}
  .row .n{flex:1;color:var(--muted);font-size:12px;}

  @media(max-width:600px){
    body{padding:20px 12px 48px;}
    h1{font-size:24px;}
    #hs-row{gap:22px;}
    .hs-num{font-size:30px;}
    .row{gap:8px;}
    .row .d{min-width:92px;font-size:12px;}
    .row .dwk{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="../../index.html"><span class="arr">👈</span> Home</a>
    <div class="titlebar">
      <h1>🌿&ensp;Wellness</h1>
      <span class="xt" id="jin-toggle"><span class="sw"></span>show in 斤</span>
    </div>
    <div class="subtitle" id="sub-label"></div>
    <div id="hs-row"></div>
  </header>

  <div id="health"></div>

</div>
<script src="../../assets/js/health.js"></script>
<script src="../../assets/js/scroll-restore.js"></script>
<script src="../../assets/js/gate.js" data-hash="e5ff17277ccd425b7de89ea91e06f03ee5856e263969760e5bee805cc0e52843"></script>
</body>
</html>
