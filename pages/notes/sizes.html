<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Size Book · Chelsea</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px;letter-spacing:.5px;}
  .subtitle{font-size:12px;color:var(--muted);letter-spacing:1.5px;margin:5px 0 24px;}

  .card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:6px 18px 14px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.5px;
    margin:0 0 10px;padding:10px 0;display:flex;align-items:baseline;border-bottom:1px solid var(--line);}
  .card h2 .gp{margin-left:auto;font-size:12px;color:var(--muted);}
  .empty{padding:26px 6px;text-align:center;color:var(--muted);font-size:14px;}

  /* 尺码表格（参考电商尺码表） */
  .tbl-wrap{overflow-x:auto;margin:2px -4px 4px;}
  table{width:100%;border-collapse:collapse;}
  th{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:1px;text-align:center;
    padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px;text-align:center;border-bottom:1px dashed var(--line);font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .15s ease;}
  tbody tr:hover{background:rgba(242,142,84,.05);}
  th.l,td.l{text-align:left;}
  td.l{font-size:13px;width:1%;white-space:nowrap;padding-right:26px;}
  td.l b{font-weight:700;display:block;font-family:var(--serif);font-size:14.5px;letter-spacing:.6px;}
  td.l .inm{margin-top:3px;color:var(--muted);font-size:12.5px;}
  td.v{font-family:var(--serif);font-weight:700;font-size:14.5px;letter-spacing:.3px;}
  th.m + th.m,td.v + td.v{border-left:1px dashed var(--line);}
  td.pc{width:104px;padding:10px 4px 10px 4px;}
  td.pc img{width:92px;height:115px;object-fit:cover;border-radius:10px;cursor:zoom-in;
    display:block;transition:transform .2s ease;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.35);}
  td.pc img:hover{transform:scale(1.04);}
  td.pc .noimg{font-size:34px;opacity:.45;}
  .size{font-family:var(--serif);font-size:12px;font-weight:700;color:var(--cd);
    border:1px solid var(--cd);border-radius:9px;padding:1px 9px;white-space:nowrap;}
  .fit{font-size:10.5px;border-radius:9px;padding:1px 8px;letter-spacing:.3px;white-space:nowrap;}
  .fit-ok{color:var(--sy);border:1px solid var(--sy);}
  .fit-loose{color:var(--fly);border:1px solid var(--fly);}
  .fit-tight{color:var(--jp);border:1px solid var(--jp);}
  .nt{font-size:11px;color:var(--muted);margin-top:3px;font-weight:400;}

  /* My Latest 围度对照条 */
  .mrow{display:flex;flex-wrap:wrap;gap:6px 8px;}
  .mk{font-size:12px;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:2px 9px;white-space:nowrap;}
  .mk i{font-style:normal;font-size:9.5px;color:var(--muted);letter-spacing:.8px;margin-right:5px;}
  .mrow.my{padding:2px 0 6px;}
  .mrow.my .mk{font-family:var(--serif);font-weight:700;font-size:14px;}

  /* 图片浮窗 */
  .lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);display:none;
    align-items:center;justify-content:center;cursor:zoom-out;}
  .lightbox.on{display:flex;}
  .lightbox img{max-width:92vw;max-height:88vh;border-radius:10px;}
  .lightbox .lb-x{position:absolute;top:18px;right:26px;font-size:22px;color:#fff;opacity:.8;cursor:pointer;}

  @media (max-width:640px){
    body{padding:22px 12px 48px;}
    td,th{padding:8px 7px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="home-link" href="health.html"><span class="arr">👈</span> Wellness</a>
  <h1>👗&ensp;Size Book</h1>
  <div class="subtitle">CLOTHING SIZE REFERENCE · CM</div>
  <div id="sizes"></div>
</div>
<script src="../../assets/js/gate.js" data-enc="../../assets/data/health/sizes.json.enc"></script>
<script src="../../assets/js/sizes.js"></script>
<script src="../../assets/js/scroll-restore.js"></script>
</body>
</html>
