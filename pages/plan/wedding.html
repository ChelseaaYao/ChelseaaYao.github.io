<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banquet Plan · Chelsea</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px;letter-spacing:.5px;}
  .sub{font-family:var(--serif);color:var(--muted);font-size:14px;margin-bottom:26px;}
  .sub b{color:var(--ink);font-weight:400;}

  .card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:6px 20px 18px;margin-bottom:22px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .block h2{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.5px;
    margin:0;padding:12px 0 10px;display:flex;align-items:baseline;}
  .block h2 .gp{margin-left:auto;font-size:12px;color:var(--muted);}
  .gbar{height:4px;border-radius:2px;background:#33373f;margin:0 0 16px;overflow:hidden;}
  .gbar i{display:block;height:100%;border-radius:2px;}

  .venues{margin:2px 0 14px;}
  .venue{display:block;padding:2px 0;font-size:13px;color:var(--muted);}
  .venue b{color:var(--ink);font-weight:700;}
  .venue .vd{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.3px;}
  .venue .vd.tbd{font-size:13px;font-weight:400;color:var(--muted);}

  .secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .sec{background:#2e323a;border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px;}
  .sname{font-size:14px;font-weight:700;letter-spacing:.3px;
    padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);}
  .item{display:flex;align-items:center;gap:8px;font-size:14px;padding:4px 0;}
  .item .tick{flex:none;color:var(--sy);font-weight:700;}
  .item.done{color:var(--muted);}

  /* 酒店考察卡 */
  .hotels{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
  .hotels.cols3{grid-template-columns:repeat(3,minmax(0,1fr));}
  /* 策划对比表 */
  .ctabw{overflow-x:auto;margin:2px 0 20px;border:1px solid var(--line);border-radius:14px;background:#2e323a;}
  .ctab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:680px;}
  .ctab th{text-align:left;padding:12px 14px;font-family:var(--serif);font-size:13.5px;font-weight:700;
    letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.03);}
  .ctab th:first-child{font-family:inherit;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:1.2px;}
  .ctab .cchip{font-size:12.5px;letter-spacing:.4px;color:var(--jp);}
  .ctab td{padding:8px 14px;border-bottom:1px dashed var(--line);vertical-align:top;line-height:1.55;}
  .ctab tbody tr:nth-child(even) td{background:rgba(255,255,255,.022);}
  .ctab tbody tr:hover td{background:rgba(255,255,255,.055);}
  .ctab tr:last-child td{border-bottom:none;}
  .ctab td.ci{color:var(--muted);font-size:11.5px;letter-spacing:.5px;white-space:nowrap;}
  .ctab td.mut{color:var(--muted);opacity:.5;}
  .ctab td.star{color:var(--bj);letter-spacing:2px;}
  @media (max-width:1000px){.hotels.cols3{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}}
  .hotel{background:#2e323a;border:1px solid var(--line);border-radius:14px;padding:16px 18px 15px;}
  .hname{display:flex;align-items:baseline;gap:8px;
    font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:.4px;}
  .hname .hmedal{flex:none;}
  .hname .hrec{flex:none;margin-left:auto;font-size:12px;}
  /* 选定条目：高亮卡片（暖金描边 + 微光底色） */
  .hotel.chosen{border-color:var(--bj);box-shadow:0 0 0 1px var(--bj),0 0 18px rgba(224,165,58,.22);
    background:linear-gradient(180deg,rgba(224,165,58,.10),rgba(224,165,58,.03)),#2e323a;}
  .hname .hpick{flex:none;font-size:10.5px;font-weight:600;color:var(--bj);
    border:1px solid rgba(224,165,58,.5);background:rgba(224,165,58,.1);
    border-radius:999px;padding:1px 9px;letter-spacing:1.5px;}
  .hphotos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px;}
  .hphotos img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;cursor:zoom-in;
    border-radius:8px;border:1px solid var(--line);transition:transform .25s;}
  .hphotos img:hover{transform:scale(1.03);}
  .lightbox{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.82);cursor:zoom-out;padding:20px;}
  .lightbox.on{display:flex;}
  .lightbox img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);}
  .lightbox .lb-x{position:absolute;top:14px;right:20px;font-size:26px;color:#fff;opacity:.8;cursor:pointer;}
  .lightbox .lb-x:hover{opacity:1;}
  .hmeta{display:flex;justify-content:space-between;gap:12px;
    margin:11px 0 11px;padding-bottom:12px;border-bottom:1px dashed var(--line);}
  .hmeta .mcell{display:flex;flex-direction:column;gap:3px;}
  .hmeta .ml{font-size:10.5px;color:var(--muted);letter-spacing:2px;}
  .hmeta .mv{font-size:12.5px;letter-spacing:.5px;line-height:1.3;}
  .hmeta .dollars{color:var(--bj);letter-spacing:1.5px;font-size:13.5px;}
  .hprice{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;
    background:rgba(224,165,58,.07);border:1px solid rgba(224,165,58,.22);border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:700;color:var(--bj);line-height:1.7;}
  .hprice .hpico{flex:none;}
  /* Planning 块（策划卡）：价格框跟块主题色（红），不用黄色 */
  .hotels.cols3 .hprice{background:rgba(229,107,126,.07);border-color:rgba(229,107,126,.25);color:var(--jp);}
  .hprice .hplines{flex:1;}
  .hsh{font-size:13px;font-weight:700;letter-spacing:.3px;margin:11px 0 3px;}
  .hkey{font-size:13px;color:#b8bec8;line-height:1.65;padding-left:19px;position:relative;}
  .hkey::before{content:"·";position:absolute;left:7px;font-weight:700;}
  .hpros,.hcons{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;line-height:1.7;}
  .hpros{margin-top:11px;color:var(--sy);}
  .hcons{margin-top:3px;color:#d98b8b;}
  /* 宾客名单 */
  .ghead{display:flex;align-items:baseline;font-size:14px;font-weight:700;margin:6px 0 9px;}
  .ghead .gcnt{margin-left:10px;font-size:12px;font-weight:400;color:var(--muted);}
  .gchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .gchip{background:#2e323a;border:1px solid var(--line);border-radius:18px;padding:4px 13px;font-size:13px;}
  .gchip i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px;}
  .gempty{color:var(--muted);font-size:13px;padding:0 0 12px;}

  .ckhead{font-size:15px;font-weight:700;letter-spacing:.3px;margin:20px 0 10px;}
  h2 + .ckhead{margin-top:2px;}
  .ckhead .cknote{margin-left:10px;font-size:12px;font-weight:400;color:var(--muted);}
  .cklist{columns:3;column-gap:24px;}
  .ck{font-size:13.5px;color:#b8bec8;padding:3px 0;break-inside:avoid;}

  @media(max-width:600px){
    .cklist{columns:2;}
    body{padding:20px 12px 48px;}
    h1{font-size:24px;}
    .secs{grid-template-columns:1fr 1fr;gap:14px 16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="../../index.html"><span class="arr">👈</span> Home</a>
    <h1>🎎&ensp;Banquet Plan</h1>
    <div class="sub">Chengdu · Shenyang · December 2026 🧨</div>
  </header>

  <div id="plan"></div>

</div>
<script src="../../assets/js/wedding.js"></script>
<script src="../../assets/js/scroll-restore.js"></script>
</body>
</html>
