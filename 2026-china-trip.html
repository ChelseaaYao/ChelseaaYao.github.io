<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dec 2026 China Trip Plan · Chelsea</title>
<link rel="stylesheet" href="assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:1280px;margin:0 auto;}
  header.top{margin-bottom:22px;}
  h1{font-family:var(--serif);font-size:30px;margin:0 0 4px;letter-spacing:.5px;}
  h1 .by{font-size:14px;color:var(--muted);font-weight:400;margin-left:10px;}
  .sub{color:var(--muted);font-size:14px;}
  .route{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:13px;}
  .route .stop{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);}
  .route .stop i{width:8px;height:8px;border-radius:50%;}
  .route .arr{color:var(--muted);font-size:12px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:26px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  h2{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  h2 .dot{display:none;}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:13px;height:13px;border-radius:4px;display:inline-block;}

  /* TIMELINE */
  .tl{position:relative;margin:24px 4px 8px;}
  .tl-track{display:flex;height:52px;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);}
  .seg{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;text-align:center;padding:0 4px;line-height:1.2;}
  .seg small{font-weight:400;font-size:10px;opacity:.92;margin-top:2px;}
  .seg.fly{background:var(--fly);} .seg.jp{background:var(--jp);} .seg.cd{background:var(--cd);}
  .seg.sy{background:var(--sy);} .seg.dl{background:var(--dl);} .seg.bj{background:var(--jp);}
  .tl-axis{position:relative;height:16px;margin-top:9px;font-size:10px;color:var(--muted);}
  .tick{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap;font-weight:700;}
  .tick::before{content:"";position:absolute;top:-8px;left:50%;width:1px;height:6px;background:#4a505a;}
  .tick.lo{top:20px;}
  .tick.lo::before{top:-22px;height:20px;}

  /* CALENDAR */
  table{width:100%;border-collapse:collapse;table-layout:fixed;}
  th{font-family:var(--serif);font-size:14px;font-weight:700;padding:9px 0;text-align:center;border:1px solid var(--line);color:var(--wkdy);background:#31353d;}
  th.we{background:#3a3f49;color:var(--wknd);}
  td{border:1px solid var(--line);vertical-align:top;height:150px;padding:9px 10px;position:relative;}
  td.pre{background:#212328;}
  td.pre .dhead{color:#6b7079;}
  td.we{background:#30343c;}
  .dhead{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--wkdy);margin-bottom:8px;}
  td.we .dhead{color:var(--wknd);}
  .demoji{font-family:-apple-system,"Apple Color Emoji","Noto Color Emoji",sans-serif;font-weight:400;font-size:15px;vertical-align:-1px;}
  .dlabel{font-family:var(--body);font-weight:400;font-size:12px;color:#cfd4dc;}
  .body{font-family:var(--body);font-size:13px;color:#e4e8ee;}
  .body div{margin-top:3px;}
  .body .sub2{color:#868c96;font-size:12px;}
  .accent{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 0 0 0;}
  .a-fly{background:var(--fly);} .a-jp{background:var(--jp);} .a-cd{background:var(--cd);}
  .a-sy{background:var(--sy);} .a-bj{background:var(--jp);}

  .todo-row{display:flex;gap:26px;align-items:flex-start;}
  .todo-row .card{flex:1;margin-bottom:26px;}
  .todo label{display:flex;align-items:center;gap:4px;margin:8px 0;color:var(--ink);}
  .todo-link{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;}
  .todo-link:hover{color:var(--cd);}
  .todo .tag{margin-left:auto;font-size:11px;padding:2px 10px;border-radius:20px;white-space:nowrap;}
  .todo .tag.doing{color:var(--bj);border:1px solid var(--bj);}
  .todo .tag.notyet{color:var(--muted);border:1px solid var(--line);}
  #cal{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media(max-width:820px){
    body{padding:20px 12px 48px;}
    .card{padding:16px 14px;}
    #cal table{min-width:860px;}
    td{height:130px;}
    .todo-row{gap:12px;}
    .todo label{font-size:13px;}
    .todo .tag{font-size:10px;padding:2px 7px;}
    .seg{font-size:11px;}
    h1{font-size:24px;}
  }
  /* 窄到文字会被挤压时才退回上下排列（拉伸满宽，两框同宽） */
  @media(max-width:460px){
    .todo-row{flex-direction:column;gap:0;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home-link" href="index.html"><span class="arr">👈</span>Home</a>
    <h1>🇨🇳 Dec 2026 China Trip Plan<span class="by">by Chelsea</span></h1>
    <div class="sub">Dec 4, 2026 (Fri) – Jan 2, 2027 (Sat)</div>
    <div class="route">
      <span class="stop"><i style="background:var(--fly)"></i>🇺🇸</span>
      <span class="arr">→</span>
      <span class="stop"><i style="background:var(--cd)"></i>🐼 成都</span>
      <span class="arr">→</span>
      <span class="stop"><i style="background:var(--sy)"></i><i style="background:var(--dl)"></i>❄️ 沈阳 / 大连</span>
      <span class="arr">→</span>
      <span class="stop"><i style="background:var(--jp)"></i>🏛 北京</span>
      <span class="arr">→</span>
      <span class="stop"><i style="background:var(--cd)"></i>🐼 成都</span>
      <span class="arr">→</span>
      <span class="stop"><i style="background:var(--fly)"></i>🇺🇸</span>
    </div>
  </header>

  <!-- TIMELINE -->
  <section class="card">
    <h2><span class="dot"></span>⌚️&ensp;Timeline</h2>
    <div class="legend">
      <span><i class="sw" style="background:var(--cd)"></i>成都</span>
      <span><i class="sw" style="background:var(--sy)"></i>沈阳</span>
      <span><i class="sw" style="background:var(--dl)"></i>大连</span>
      <span><i class="sw" style="background:var(--jp)"></i>北京</span>
      <span><i class="sw" style="background:var(--fly)"></i>航班 / 在途</span>
    </div>
    <div class="tl">
      <div class="tl-track" id="tlTrack" data-end="1/2">
        <div class="seg fly" style="flex:2" data-tick="12/4">✈️</div>
        <div class="seg cd"  style="flex:10" data-tick="12/6">成都</div>
        <div class="seg sy"  style="flex:6" data-tick="12/16">沈阳</div>
        <div class="seg dl"  style="flex:2" data-tick="12/22">大连</div>
        <div class="seg sy"  style="flex:2" data-tick="12/24">沈阳</div>
        <div class="seg bj"  style="flex:3" data-tick="12/26">北京</div>
        <div class="seg cd"  style="flex:4" data-tick="12/29">成都</div>
        <div class="seg fly" style="flex:2" data-tick="1/2">✈️</div>
      </div>
      <div class="tl-axis" id="tlAxis"></div>
    </div>
  </section>

  <!-- CALENDAR -->
  <section class="card">
    <h2><span class="dot" style="background:var(--sy)"></span>📅&ensp;Calendar</h2>
    <div id="cal"></div>
  </section>

  <!-- TODO -->
  <div class="todo-row">
    <section class="card">
      <h2><span class="dot" style="background:#3fa96a"></span>🇺🇸&ensp;行前 TODO LIST</h2>
      <div class="todo">
        <label>🛂&ensp;DKL 中国签证<span class="tag doing">in progress</span></label>
        <label>✈️&ensp;<a class="todo-link" href="pages/plan/flights.html">机票</a><span class="tag doing">in progress</span></label>
        <label>🎁&ensp;<a class="todo-link" href="pages/plan/gifts.html">伴手礼</a><span class="tag doing">in progress</span></label>
        <label>🐕&ensp;Ali 寄养<span class="tag notyet">not started</span></label>
      </div>
    </section>
    <section class="card">
      <h2><span class="dot" style="background:#e83e8c"></span>🇨🇳&ensp;TODO LIST</h2>
      <div class="todo">
        <label>👓&ensp;配眼镜</label>
        <label>💇&ensp;理发</label>
        <label>💅&ensp;美甲</label>
        <label>🎎&ensp;<a class="todo-link" href="pages/plan/wedding.html">答谢宴 / 领证</a></label>
        <label>📷&ensp;结婚照</label>
        <label>📿&ensp;穿手绳</label>
        <label>🏥&ensp;眼袋</label>
      </div>
    </section>
  </div>
</div>

<script>
// city: 用于左侧色条 fly/jp/cd/sy/bj ；top: 日期后的 emoji/标签；body: 当天安排（数组，(...) 会变灰）
const plan = {
  '2026-11-30':{}, '2026-12-01':{}, '2026-12-02':{}, '2026-12-03':{},
  '2026-12-04':{city:'fly',top:'✈️',body:['下班 ➡️ LAX','21:30 ✈️成都']},
  '2026-12-05':{city:'fly',top:'✈️',body:['✈️ 飞行 / 跨日界线']},
  '2026-12-06':{city:'cd',top:'🐼',body:['8:10 落地天府','成都 Day 1']},
  '2026-12-07':{city:'cd',top:'🐼',body:['成都 Day 2','(💅 美甲 / 💇 理发 / 👓 配眼镜)']},
  '2026-12-08':{city:'cd',top:'🐼',body:['成都 Day 3','(💅 美甲 / 💇 理发 / 👓 配眼镜)']},
  '2026-12-09':{city:'cd',top:'🐼',body:['成都 Day 4']},
  '2026-12-10':{city:'cd',top:'🐼',body:['成都 Day 5']},
  '2026-12-11':{city:'cd',top:'🐼',body:['成都 Day 6','dkl 爸妈来成都']},
  '2026-12-12':{city:'cd',top:'🐼',body:['成都 Day 7','(成都答谢宴)']},
  '2026-12-13':{city:'cd',top:'🐼',body:['成都 Day 8','(成都答谢宴)']},
  '2026-12-14':{city:'cd',top:'🐼',body:['成都 Day 9','🗻 乐山']},
  '2026-12-15':{city:'cd',top:'🐼',body:['成都 Day 10']},
  '2026-12-16':{city:'fly',top:'✈️',body:['成都 ➡️ 沈阳']},
  '2026-12-17':{city:'sy',top:'❄️',body:['沈阳 Day 1']},
  '2026-12-18':{city:'sy',top:'❄️',body:['沈阳 Day 2','🛁 洗浴']},
  '2026-12-19':{city:'sy',top:'❄️',body:['沈阳 Day 3']},
  '2026-12-20':{city:'sy',top:'❄️',body:['沈阳 Day 4','🍽 沈阳答谢宴']},
  '2026-12-21':{city:'sy',top:'❄️',body:['沈阳 Day 5','(💒 领结婚证)']},
  '2026-12-22':{city:'sy',top:'❄️',body:['沈阳 Day 6','🛳 大连']},
  '2026-12-23':{city:'sy',top:'❄️',body:['沈阳 Day 7','🛳 大连']},
  '2026-12-24':{city:'sy',top:'🎄 平安夜',body:['沈阳 Day 8']},
  '2026-12-25':{city:'sy',top:'🎄 圣诞',body:['沈阳 Day 9']},
  '2026-12-26':{city:'bj',top:'✈️',body:['沈阳 ➡️ 北京']},
  '2026-12-27':{city:'bj',top:'',body:['北京']},
  '2026-12-28':{city:'fly',top:'',body:['北京 ➡️ 成都']},
  '2026-12-29':{city:'cd',top:'🐼',body:['成都 Day 1']},
  '2026-12-30':{city:'cd',top:'🐼',body:['成都 Day 2']},
  '2026-12-31':{city:'cd',top:'🎉 跨年',body:['成都 Day 3']},
  '2027-01-01':{city:'cd',top:'🎉 元旦',body:['成都 Day 4','💅 美甲']},
  '2027-01-02':{city:'fly',top:'✈️',body:['成都 ✈️ LA','🏠 到家']},
  '2027-01-03':{city:'fly',top:'🏠',body:['休整']}
};

const heads = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const start = new Date(2026,10,30);   // Mon 11/30
const TOTAL = 35;                      // 5 周整
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

let html = '<table><thead><tr>';
heads.forEach((h,i)=>html+='<th class="'+(i>=5?'we':'')+'">'+h+'</th>');
html += '</tr></thead><tbody>';
for(let w=0; w<5; w++){
  html+='<tr>';
  for(let d=0; d<7; d++){
    const date = new Date(start); date.setDate(start.getDate()+w*7+d);
    const key = iso(date);
    const info = plan[key] || {};
    const we = (d>=5);
    const pre = (date < new Date(2026,11,4));
    let cls = []; if(we) cls.push('we'); if(pre) cls.push('pre');
    html+='<td class="'+cls.join(' ')+'">';
    if(info.city) html+='<span class="accent a-'+info.city+'"></span>';
    let topHtml='';
    if(info.top){
      const parts=info.top.split(/\s+/);
      const emo=parts.shift();
      const rest=parts.join(' ');
      topHtml=' <span class="demoji">'+emo+'</span>'+(rest?' <span class="dlabel">'+rest+'</span>':'');
    }
    html+='<div class="dhead">'+(date.getMonth()+1)+'/'+date.getDate()+topHtml+'</div>';
    if(info.body && info.body.length){
      html+='<div class="body">';
      info.body.forEach(t=>{
        const sub = /^\(/.test(t);
        html+='<div class="'+(sub?'sub2':'')+'">'+t+'</div>';
      });
      html+='</div>';
    }
    html+='</td>';
  }
  html+='</tr>';
}
html+='</tbody></table>';
document.getElementById('cal').innerHTML = html;

// Timeline 刻度：读取色块渲染后的真实位置，吸附到边界
function drawTicks(){
  const track = document.getElementById('tlTrack');
  const tr = track.getBoundingClientRect();
  let ax = '';
  Array.from(track.children).forEach(el=>{
    if(el.dataset.tick){
      const x = (el.getBoundingClientRect().left - tr.left) / tr.width * 100;
      ax += '<div class="tick" style="left:'+x.toFixed(3)+'%">'+el.dataset.tick+'</div>';
    }
  });
  if(track.dataset.end) ax += '<div class="tick" style="left:100%">'+track.dataset.end+'</div>';
  const axis = document.getElementById('tlAxis');
  axis.innerHTML = ax;
  // 窄屏防重叠：与上一个标签相撞的刻度自动落到第二排
  let r0 = -1e9, r1 = -1e9;
  Array.from(axis.children).forEach(t=>{
    const b = t.getBoundingClientRect();
    if(b.left < r0 + 4){ t.classList.add('lo'); r1 = b.right; }
    else r0 = b.right;
  });
  axis.style.height = axis.querySelector('.lo') ? '32px' : '';
}
drawTicks();
window.addEventListener('resize', drawTicks);
</script>
<script src="assets/js/scroll-restore.js"></script>
</body>
</html>
