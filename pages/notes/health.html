<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellness · Chelsea</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px;letter-spacing:.5px;}

  /* 单位开关（ledger 同款滑块，放大标题右侧） */
  .titlebar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .xt{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.2px;
    color:var(--muted);cursor:pointer;user-select:none;transition:color .15s ease;}
  .xt:hover{color:var(--ink);}
  .xt .sw{width:32px;height:18px;border-radius:9px;background:#3a3f48;position:relative;
    flex:none;transition:background .2s ease;}
  .xt .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;
    border-radius:50%;background:#8a919c;transition:left .2s ease,background .2s ease;}
  .xt.on{color:var(--ink);}
  .xt.on .sw{background:var(--cd);}
  .xt.on .sw::after{left:16px;background:#fff;}

  /* 副标题（与 ledger .hs-label 完全一致） */
  .subtitle{font-size:12px;color:var(--muted);letter-spacing:1.5px;margin:5px 0 0;}

  /* 顶部大数字 */
  #hs-row{margin:24px 0 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:end;}
  .hs{min-width:0;}
  .hs + .hs{border-left:1px dashed var(--line);padding-left:24px;}
  .hs-label{font-size:12px;color:var(--muted);letter-spacing:1.5px;}
  .hs-num{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.5px;line-height:1.15;
    background:linear-gradient(92deg,var(--cd) 10%,var(--jp) 55%,var(--bj) 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;}
  .hs-num i{font-style:normal;font-size:15px;margin-left:4px;-webkit-text-fill-color:var(--muted);}
  .hs-num.good{background:none;-webkit-background-clip:unset;background-clip:unset;color:var(--sy);}
  .hs-num.bad{background:none;-webkit-background-clip:unset;background-clip:unset;color:var(--jp);}
  .hs-sub{font-size:11px;color:var(--muted);margin-top:2px;}

  /* 对比行：较昨日 / 上周同日 / 上月同日 —— 一条基线对齐的小字横排 */
  #cmp-row{display:flex;flex-wrap:wrap;gap:6px 30px;align-items:baseline;margin:4px 0 28px;}
  .cs{display:flex;align-items:baseline;gap:8px;min-width:0;}
  .cs-k{font-size:11px;color:var(--muted);letter-spacing:1.2px;}
  .cs-v{font-family:var(--serif);font-size:15px;font-weight:700;}
  .cs-v.good{color:var(--sy);}
  .cs-v.bad{color:var(--jp);}
  .cs-sub{font-size:10.5px;color:var(--muted);}

  .card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:6px 18px 12px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.5px;
    margin:0 0 4px;padding:10px 0;display:flex;align-items:baseline;border-bottom:1px solid var(--line);}
  .card h2 .gp{margin-left:auto;font-size:12px;color:var(--muted);}
  .card h2 .gp .gt{font-size:17px;font-weight:700;color:var(--bj);}
  .empty{padding:26px 6px;text-align:center;color:var(--muted);font-size:14px;}

  /* 趋势图 */
  .chart-wrap{padding:10px 2px 0;}
  .chart{display:block;margin:0 auto;max-width:100%;height:auto;}
  .chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;}
  .chart .ax{fill:#9aa1ab;font-size:10px;letter-spacing:.3px;}
  .chart .line{fill:none;stroke:var(--cd);stroke-width:1.8;stroke-linejoin:round;}
  .chart .area{stroke:none;fill:url(#wg);}
  .chart .ma{fill:none;stroke:var(--fly);stroke-width:1.6;stroke-dasharray:6 4;opacity:.9;stroke-linejoin:round;}
  .chart .dot{fill:var(--cd);stroke:var(--paper);stroke-width:1.2;pointer-events:none;}
  .chart .hit{fill:transparent;pointer-events:all;cursor:pointer;}
  .chart .hit:hover{fill:rgba(242,142,84,.18);}
  .chart .mdot{cursor:pointer;}

  /* 悬浮提示 */
  .tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s ease;
    background:#1f2126;border:1px solid #4a505a;border-radius:8px;padding:5px 11px;
    font-size:12.5px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.45);white-space:pre-line;text-align:center;}
  .tip.on{opacity:1;}
  .tip .tv{color:var(--cd);font-weight:700;}
  .tip .tm{color:var(--fly);font-weight:700;}
  .tip .tg{color:var(--sy);font-weight:700;}
  .tip .tb{color:var(--jp);font-weight:700;}
  .chart .goalln{stroke:var(--sy);stroke-width:1;stroke-dasharray:5 4;opacity:.8;}
  .chart .goal-lab{fill:var(--sy);font-size:10px;letter-spacing:.3px;}
  .chart .pmark{stroke:var(--jp);stroke-width:1;stroke-dasharray:3 3;opacity:.55;}
  .chart .pflower{font-size:9px;}
  .chart .avgln{stroke:#9aa1ab;stroke-width:1;stroke-dasharray:4 4;opacity:.65;}
  .chart .avglab{fill:var(--bj);font-size:10.5px;letter-spacing:.5px;font-weight:700;}
  .chart .ring{fill:none;stroke-width:1.5;}
  .chart .ring.max{stroke:var(--jp);}
  .chart .ring.min{stroke:var(--sy);}
  h2 .rtabs{margin-left:auto;display:inline-flex;gap:8px;}
  h2 .rt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:2px 12px;cursor:pointer;transition:color .15s ease,border-color .15s ease;}
  h2 .rt:hover{color:var(--ink);border-color:#4a505a;}
  h2 .rt.on{color:var(--cd);border-color:var(--cd);font-weight:700;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:4px 6px 8px;font-size:11px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:16px;height:0;border-top:2px solid;border-radius:1px;}
  .legend .lw{border-color:var(--cd);}
  .legend .lm{border-top-style:dashed;border-color:var(--fly);}
  .legend .lp{border-top-style:dashed;border-color:var(--jp);}
  .legend .lg{border-top-style:dashed;border-color:var(--sy);}

  /* 生理周期卡 */
  .chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;padding:12px 2px 10px;}
  .chip{border:1px solid var(--line);border-radius:11px;background:#2a2d34;
    padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
  .chip .ck{font-size:10.5px;color:var(--muted);letter-spacing:1px;}
  .chip .cv{font-family:var(--serif);font-size:17px;font-weight:700;}
  .chip.nx{border-color:var(--jp);background:rgba(229,107,126,.08);}
  .chip.nx .ck{color:var(--jp);}
  .chip.nx .cv{color:var(--jp);}
  .chip .cleft{display:none;font-size:12px;font-weight:400;margin-left:6px;opacity:.85;}
  /* 经期时间轴 */
  .chart .pblock{fill:var(--jp);opacity:.92;cursor:pointer;}
  .chart .pghost{fill:rgba(229,107,126,.1);stroke:var(--jp);stroke-width:1;stroke-dasharray:4 3;cursor:pointer;}
  .chart .plab{fill:#f4949a;font-size:10.5px;font-weight:700;}
  .chart .plab.ghost{opacity:.85;font-weight:400;}
  .chart .cycln{stroke:#5a616c;stroke-width:1;stroke-dasharray:3 3;}
  /* 排卵期/排卵日 */
  .chart .oblock{fill:rgba(139,147,230,.28);}
  .chart .oblock.est{opacity:.55;}
  .chart .oday{fill:#8b93e6;}
  .chart .oday.est{opacity:.6;}
  .legend .lo,.legend .lod{width:14px;height:8px;border-top:none;border-radius:2px;}
  .legend .lo{background:rgba(139,147,230,.4);}
  .legend .lod{background:#8b93e6;}
  /* 激素示意图 */
  .chart .hbg.hp{fill:rgba(229,107,126,.09);}
  .chart .hbg.ho{fill:rgba(139,147,230,.12);}
  .chart .hcurve{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .chart .hE{stroke:var(--jp);stroke-width:2.2;}
  .chart .hL{stroke:#7ba7e0;stroke-width:1.8;stroke-dasharray:5 4;}
  .chart .hP{stroke:var(--bj);stroke-width:1.8;stroke-dasharray:2.5 3.5;}
  .chart .hseg.hp{fill:rgba(229,107,126,.55);}
  .chart .hseg.hf{fill:rgba(123,167,224,.32);}
  .chart .hseg.ho{fill:rgba(139,147,230,.75);}
  .chart .hseg.hl{fill:rgba(224,165,58,.38);}
  .chart .hlab{fill:#9aa1ab;font-size:10px;letter-spacing:1px;}
  .chart .hen{fill:rgba(255,255,255,.88);font-size:9px;letter-spacing:.8px;}
  /* PHASE chip 按阶段着色 */
  .chip .cv.phP{color:#f4949a;}
  .chip .cv.phF{color:#7ba7e0;}
  .chip .cv.phO{color:#8b93e6;}
  .chip .cv.phL{color:var(--bj);}
  .chip .cv.phX{color:var(--jp);}
  .legend.cen{justify-content:center;}
  .legend .hle{border-color:var(--jp);}
  .legend .hll{border-top-style:dashed;border-color:#7ba7e0;}
  .legend .hlp{border-top-style:dashed;border-color:var(--bj);}
  /* Cycle 卡里激素小节的分隔线 */
  .hdiv{border-top:1px dashed var(--line);margin:12px 0 2px;}
  .chart .cyclab{fill:#9aa1ab;font-size:10.5px;letter-spacing:.3px;}
  .chart .todayln{stroke:var(--cd);stroke-width:1;stroke-dasharray:3 3;opacity:.7;}
  .chart .todaylab{fill:var(--cd);font-size:9.5px;letter-spacing:.5px;}

  /* 月均体重折线 */
  .chart .mline{fill:none;stroke:var(--bj);stroke-width:1.8;stroke-linejoin:round;}
  .chart .mdot{fill:var(--bj);stroke:var(--paper);stroke-width:1.5;}
  .chart .mdot.good{fill:var(--sy);}
  .chart .mdot.bad{fill:var(--jp);}
  .chart .mval{fill:#e8eaed;font-size:11px;font-weight:700;}
  .chart .mval.good{fill:var(--sy);}
  .chart .mval.bad{fill:var(--jp);}
  .chart .mmon{fill:#9aa1ab;font-size:11px;letter-spacing:.5px;}

  /* 记录列表月份组头 */
  .mhead{margin:12px 2px 2px;font-size:13.5px;color:var(--cd);letter-spacing:1.5px;
    border-bottom:1px solid var(--line);padding:0 4px 5px;}
  .row .d.pd{color:#f4949a;font-weight:700;}

  /* 月份切换胶囊（ledger 同款） */
  .mtabs{display:flex;flex-wrap:wrap;gap:9px;margin:10px 2px 10px;justify-content:center;}
  .mt{padding:5px 16px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;
    color:var(--muted);cursor:pointer;transition:color .15s ease,border-color .15s ease;}
  .mt:hover{color:var(--ink);border-color:#4a505a;}
  .mt.on{color:var(--cd);border-color:var(--cd);font-weight:700;}

  /* Logs 明细折叠开关 */
  .lg-toggle{margin-top:10px;padding:9px 0 2px;border-top:1px dashed var(--line);
    text-align:center;font-size:12px;color:var(--muted);cursor:pointer;letter-spacing:.6px;}
  .lg-toggle:hover{color:var(--ink);}

  /* 月历竖排滚动容器：上下滑动翻月，月份头吸顶 */
  .calscroll{position:relative;height:540px;overflow-y:auto;margin:4px 0 6px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    transition:height .25s ease;
    scroll-snap-type:y proximity;overscroll-behavior:contain;scrollbar-width:none;}
  .calscroll::-webkit-scrollbar{display:none;}
  .calmonth{scroll-snap-align:start;padding-bottom:4px;}
  .calm-h{font-family:var(--serif);font-size:15px;line-height:22px;letter-spacing:.6px;color:var(--ink);
    padding:9px 4px 7px;border-bottom:1px solid var(--line);}
  /* 星期栏固定在滚动区外，永远不动 */
  .calweek{margin-top:4px;border-bottom:1px solid var(--line);}

  /* 迷你月历（参考薄荷健康 + 网格线）：日期居中、体重在下 */
  .calwrap{margin:6px 0 4px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cw{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px;letter-spacing:1px;}
  .cw.wk{color:var(--wknd);}
  .cday{height:74px;padding:5px 2px 6px;min-width:0;text-align:center;overflow:hidden;
    border-top:1px dashed var(--line);border-right:1px dashed var(--line);}
  .cday:nth-child(7n){border-right:none;}
  .cday:nth-child(7n+1){border-left:none;}
  .cn{display:block;width:26px;line-height:26px;margin:0 auto;font-size:14.5px;font-weight:600;
    color:var(--wkdy);border-radius:50%;}
  .cday.today{border-radius:10px;background:rgba(242,142,84,.08);box-shadow:inset 0 0 0 1.5px var(--cd);}
  .cday.today .cn{color:var(--cd);font-weight:700;}
  .cday.period{background:rgba(229,107,126,.13);}
  .cday.period .cn{color:#f4949a;font-weight:700;}
  .cday.period.today{background:rgba(229,107,126,.08);box-shadow:inset 0 0 0 1.5px var(--jp);}
  .cday.period.today .cn{color:var(--jp);}
  .dsum{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--cd);margin-top:3px;}
  .wsum{display:block;text-align:center;font-size:10.5px;font-weight:600;color:var(--sy);margin-top:1px;}
  .chart .wdot{fill:var(--sy);opacity:.9;cursor:pointer;}
  .chart .xhair{stroke:#8a919c;stroke-width:1;stroke-dasharray:2 3;opacity:.85;pointer-events:none;}
  .ms b.wk{color:var(--sy);}
  .ms b i{font-style:normal;font-size:11px;color:var(--muted);font-weight:400;margin-left:3px;}
  .mhead .bcmp{margin-left:10px;letter-spacing:.3px;}
  .mhead .bcmp.up{color:var(--sy);}
  .mhead .bcmp.dn{color:var(--jp);}
  /* Logs 双页签 + 运动清单 */
  h2 .lt{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:3px 12px;cursor:pointer;transition:all .15s ease;}
  h2 .lt:hover{color:var(--ink);border-color:#4a505a;}
  h2 .lt.on{color:var(--cd);border-color:var(--cd);font-weight:700;}
  .mhead{display:flex;justify-content:space-between;align-items:baseline;}
  .mhead .mhr{color:var(--muted);letter-spacing:.5px;}
  .row .df.wkk{color:var(--sy);font-weight:700;}
  .row .d{white-space:nowrap;}
  .row .wico{margin-left:8px;font-size:11px;letter-spacing:1px;cursor:pointer;}
  /* 月历按点亮的开关过滤：没亮 Weight 就藏体重和经期标记，没亮 Workouts 就藏运动 */
  #calbox:not(.has-w) .dsum{display:none;}
  #calbox:not(.has-w) .cday.period{background:transparent;}
  #calbox:not(.has-w) .cday.period .cn{color:var(--wkdy);font-weight:600;}
  #calbox:not(.has-w) .cday.period.today{background:rgba(242,142,84,.08);box-shadow:inset 0 0 0 1.5px var(--cd);}
  #calbox:not(.has-w) .cday.period.today .cn{color:var(--cd);font-weight:700;}
  #calbox:not(.has-k) .wsum{display:none;}

  /* 本月统计条 */
  .mstats{display:flex;border:1px solid var(--line);border-radius:12px;background:#2a2d34;
    padding:12px 4px;margin:10px 14px 14px;}
  .ms{flex:1;text-align:center;min-width:0;}
  .ms + .ms{border-left:1px dashed var(--line);}
  .ms .k{display:block;font-size:10.5px;color:var(--muted);letter-spacing:1.2px;margin-bottom:3px;}
  .ms b{font-family:var(--serif);font-size:17px;letter-spacing:.3px;}
  .ms b.hl{font-size:19px;background:linear-gradient(92deg,var(--cd) 10%,var(--jp) 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .ms b.good{color:var(--sy);}
  .ms b.bad{color:var(--jp);}

  /* 记录列表：比卡片再收窄一点 */
  #lg-wrap{margin:0 42px;}
  #lg-workout .row .w.wt{white-space:nowrap;font-size:13px;}
  /* 运动作为体重行的一列，写明项目名（手机隐藏此列） */
  .row .wq{flex:0 0 220px;font-size:12px;color:#7ba7e0;font-weight:600;white-space:nowrap;}
  .row{display:flex;align-items:baseline;gap:14px;padding:6px 6px;font-size:13.5px;
    border-radius:6px;transition:background .12s ease;}
  .row + .row{border-top:1px dashed var(--line);}
  .row:hover{background:#2e323a;}
  .row .d{flex:0 0 18%;min-width:110px;color:var(--muted);}
  .row .dwk{margin-left:7px;font-size:10.5px;opacity:.8;}
  .row .w{flex:0 0 14%;min-width:64px;font-weight:700;font-family:var(--serif);}
  .row .df{flex:0 0 12%;min-width:64px;font-size:12px;color:var(--muted);}
  .row .df.good{color:var(--sy);font-weight:700;}
  .row .df.bad{color:var(--jp);font-weight:700;}
  .row .n{flex:1;color:var(--muted);font-size:12px;}

  @media(max-width:600px){
    body{padding:20px 12px 48px;}
    h1{font-size:24px;}
    /* 大数字：CURRENT 独占首行放大，其余三个等分一行；stretch 让竖虚线顶到上下横线 */
    #hs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 0;align-items:stretch;}
    .hs{padding:10px 0 12px;min-width:0;}
    .hs + .hs{border-left:none;padding-left:0;}
    .hs:first-child{grid-column:1/-1;padding-top:0;border-bottom:1px dashed var(--line);padding-bottom:12px;}
    .hs:first-child .hs-num{font-size:36px;}
    .hs:nth-child(n+3){border-left:1px dashed var(--line);padding-left:12px;}
    .hs-num{font-size:22px;}
    .hs-sub{font-size:9.5px;}
    /* 对比行沿用桌面的小字横排，换行自适应；上方补虚线分隔 */
    #cmp-row{gap:4px 18px;margin-bottom:22px;border-top:1px dashed var(--line);padding-top:12px;}
    .cs-k{font-size:10px;}
    .cs-v{font-size:14px;}
    .cs-sub{font-size:9.5px;}
    /* 手机：运动列隐藏（看月历和 Workouts 页签） */
    #lg-wrap{margin:0 6px;}
    .row .wq{display:none;}
    .row{gap:8px;}
    .row .d{min-width:92px;font-size:12px;}
    .row .w{min-width:88px;}
    .row .dwk{display:none;}
    /* 折线图保持可读宽度，窄屏横向滑动（Monthly Avg 点少，不滚动直接缩放） */
    .chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .chart-wrap::-webkit-scrollbar{display:none;}
    .chart{min-width:640px;}
    .chart.nosc{min-width:0;}
    /* Monthly Avg / 激素图整体缩放后文字会太小，按比例调大；色条内英文缩放后不可读，隐藏 */
    .chart.nosc .ax{font-size:15px;}
    .chart.nosc .mval{font-size:16.5px;}
    .chart.nosc .mmon{font-size:16px;}
    .chart.nosc .hen{display:none;}
    .chart.nosc .hlab{font-size:15px;}
    .chart.nosc .avglab{font-size:15px;}
    /* 缩放后数值标签上下交错，避免相互遮挡 */
    .chart.nosc .mval.alt{transform:translateY(32px);}
    /* 周期 chips 三列两行，NEXT EST. 独占一行 */
    .chips{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);gap:8px;}
    .chip{min-width:0;padding:8px 4px;}
    .chip.nx{grid-column:1/-1;}
    .chip .cleft{display:inline;}
    /* 月统计条 2×2：AVG+CHANGE 一排，MAX+MIN 一排 */
    .mstats{flex-wrap:wrap;padding:6px 4px;margin:10px 4px 14px;}
    .ms{flex:0 0 50%;padding:8px 0;}
    .ms:nth-child(1){order:1;}
    .ms:nth-child(4){order:2;}
    .ms:nth-child(2){order:3;border-left:none;border-top:1px dashed var(--line);}
    .ms:nth-child(3){order:4;border-top:1px dashed var(--line);}
    .ms:nth-child(5){order:5;flex:0 0 100%;border-left:none;border-top:1px dashed var(--line);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="../../index.html"><span class="arr">👈</span> Home</a>
